<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.5;
            color: #5f6368;
        }
        .status-box {
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 6px;
            font-size: 14px;
            border-left: 4px solid #ccc;
            background-color: #f1f3f4;
            transition: all 0.3s ease;
        }
        .status-warning {
            background-color: #fcf8e3;
            border-left-color: #f0ad4e;
            color: #8a6d3b;
        }
        .status-danger {
            background-color: #f2dede;
            border-left-color: #d9534f;
            color: #a94442;
        }
        .status-success {
            background-color: #dff0d8;
            border-left-color: #5cb85c;
            color: #3c763d;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Multiple File Downloader</h1>
    <p>Click below to check your browser permissions and download your files.</p>
    
    <div class="status-box status-warning" id="statusBox">
        <strong>Status: Ready to test</strong><br>
        Click the button below. If downloads fail, instructions will appear.
    </div>

    <button class="btn" id="downloadBtn">Check & Download Files</button>
</div>

<script>
    const downloadBtn = document.getElementById('downloadBtn');
    const statusBox = document.getElementById('statusBox');

    function checkMultiplePopups() {
        let blockedCount = 0;
        const totalChecks = 3;

        for (let i = 0; i < totalChecks; i++) {
            try {
                const testTab = window.open('about:blank', '_blank');
                if (!testTab || testTab.closed || typeof testTab.closed === 'undefined') {
                    blockedCount++;
                } else {
                    testTab.close();
                }
            } catch (e) {
                blockedCount++;
            }
        }

        return blockedCount > 0;
    }

    function triggerDownloads() {
        const files = [
            { name: 'Document_1.txt', content: 'First file content.' },
            { name: 'Document_2.txt', content: 'Second file content.' },
            { name: 'Document_3.txt', content: 'Third file content.' }
        ];

        files.forEach((file, index) => {
            setTimeout(() => {
                const blob = new Blob([file.content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, index * 200);
        });
    }

    downloadBtn.addEventListener('click', () => {
        const isBlocked = checkMultiplePopups();

        if (isBlocked) {
            statusBox.className = "status-box status-danger";
            statusBox.innerHTML = `
                <strong>❌ Popups/Downloads Blocked!</strong><br>
                Please click the icon in your address bar and select "Always allow popups and downloads from this site", then try again.
            `;
        } else {
            statusBox.className = "status-box status-success";
            statusBox.innerHTML = `
                <strong>✅ Permissions Allowed!</strong><br>
                Triggering multi-downloads...
            `;
            triggerDownloads();
        }
    });
</script>

</body>
</html>
