<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
}
canvas#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.card {
  position: relative;
  z-index: 10;
  background: rgba(15,15,15,0.85);
  border: 1px solid rgba(220,30,30,0.35);
  border-radius: 16px;
  padding: 44px 40px 36px;
  max-width: 440px;
  width: 92vw;
  text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 60px rgba(200,20,20,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
}
.badge {
  display: inline-block;
  background: rgba(200,20,20,0.18);
  border: 1px solid rgba(200,20,20,0.4);
  color: #f87171;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 20px;
}
h1 { color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.3px; }
.sub { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
.status {
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 13px;
  text-align: left;
  margin-bottom: 24px;
  border: 1px solid;
  transition: all 0.3s ease;
  line-height: 1.6;
}
.status.idle { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); color: #777; }
.status.fail { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.35); color: #f87171; }
.status.ok { background: rgba(22,163,74,0.1); border-color: rgba(22,163,74,0.35); color: #4ade80; }
.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #b91c1c, #dc2626);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.2px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(185,28,28,0.4);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(185,28,28,0.55); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.launch-wrap { display: none; flex-direction: column; gap: 12px; margin-top: 20px; }
.launch-wrap.visible { display: flex; }
.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }
.launch-label { font-size: 12px; color: #555; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
.btn-launch {
  width: 100%;
  padding: 13px;
  background: transparent;
  color: #f87171;
  border: 1px solid rgba(220,38,38,0.45);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-launch:hover { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.7); color: #fca5a5; }
.btn-launch:disabled { opacity: 0.4; cursor: not-allowed; }
.timer-bar-wrap { display: none; width: 100%; height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.timer-bar-wrap.visible { display: block; }
.timer-bar { height: 100%; background: #dc2626; width: 100%; }
.link-status { font-size: 12px; color: #555; text-align: center; }
.link-status span { color: #f87171; font-weight: 600; }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="card">
  <div class="badge">Multi-Launch System</div>
  <h1>File Downloader</h1>
  <p class="sub">Verify browser permissions then unlock the multi-link launcher.</p>
  <div class="status idle" id="statusBox"><strong>Ready</strong> — Click below to run permission checks.</div>
  <button class="btn-primary" id="checkBtn">Check & Download Files</button>
  <div class="launch-wrap" id="launchWrap">
    <div class="divider"></div>
    <div class="launch-label">Link Launcher</div>
    <button class="btn-launch" id="launchBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Launch All 5 Links
    </button>
    <div class="timer-bar-wrap" id="timerWrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="link-status" id="linkStatus"></div>
  </div>
</div>
<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); spawnParticles(); });

function spawnParticles() {
  particles = [];
  const count = Math.floor((W * H) / 8000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H - H,
      size: Math.random() * 2.5 + 0.5, speed: Math.random() * 1.2 + 0.4,
      opacity: Math.random() * 0.6 + 0.15, wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: (Math.random() - 0.5) * 0.02, wobbleAmt: Math.random() * 0.6 + 0.2
    });
  }
}
spawnParticles();

function animate() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    p.y += p.speed;
    p.wobble += p.wobbleSpeed;
    p.x += Math.sin(p.wobble) * p.wobbleAmt;
    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    const alpha = p.opacity * (p.y < 40 ? p.y / 40 : p.y > H - 40 ? (H - p.y) / 40 : 1);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 38, 38, ${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

const checkBtn = document.getElementById('checkBtn');
const statusBox = document.getElementById('statusBox');
const launchWrap = document.getElementById('launchWrap');
const launchBtn = document.getElementById('launchBtn');
const timerWrap = document.getElementById('timerWrap');
const timerBar = document.getElementById('timerBar');
const linkStatus = document.getElementById('linkStatus');

function checkPopups() {
  let blocked = 0;
  for (let i = 0; i < 3; i++) {
    try {
      const t = window.open('about:blank', '_blank');
      if (!t || t.closed || typeof t.closed === 'undefined') blocked++;
      else t.close();
    } catch(e) { blocked++; }
  }
  return blocked > 0;
}

function triggerDownloads() {
  const files = [
    { name: 'Document_1.txt', content: 'First file content.' },
    { name: 'Document_2.txt', content: 'Second file content.' },
    { name: 'Document_3.txt', content: 'Third file content.' }
  ];
  files.forEach((file, i) => {
    setTimeout(() => {
      const blob = new Blob([file.content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }, i * 200);
  });
}

checkBtn.addEventListener('click', () => {
  const blocked = checkPopups();
  if (blocked) {
    statusBox.className = 'status fail';
    statusBox.innerHTML = '<strong>Blocked!</strong> Allow popups for this site in your address bar, then try again.';
  } else {
    statusBox.className = 'status ok';
    statusBox.innerHTML = '<strong>Permissions OK</strong> — Downloads triggered. Launcher unlocked below.';
    triggerDownloads();
    launchWrap.classList.add('visible');
  }
});

const LINKS = [
  'https://cameroncodesstuff.github.io/html5-hardware-virus/download.html',
  'https://cameroncodesstuff.github.io/html5-hardware-virus/iframe.html',
  'https://cameroncodesstuff.github.io/html5-hardware-virus/lag.html',
  'https://cameroncodesstuff.github.io/html5-hardware-virus/popup.html',
  'https://godslayer82.github.io/nobody-knows/'
];

const INTERVAL = 1;
let launchTimer = null;
let launchIndex = 0;
let timerStart = null;
let animFrame = null;

function tickTimer() {
  const elapsed = Date.now() - timerStart;
  const pct = Math.max(0, 100 - (elapsed / INTERVAL) * 100);
  timerBar.style.width = pct + '%';
  if (elapsed < INTERVAL) animFrame = requestAnimationFrame(tickTimer);
}

function openNextLink() {
  if (launchIndex >= LINKS.length) {
    clearInterval(launchTimer);
    launchTimer = null;
    cancelAnimationFrame(animFrame);
    launchBtn.disabled = false;
    launchBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Launch Again';
    timerWrap.classList.remove('visible');
    linkStatus.innerHTML = '<span>All 5 links opened!</span>';
    launchIndex = 0;
    return;
  }
  window.open(LINKS[launchIndex], '_blank');
  linkStatus.innerHTML = `Opened link <span>${launchIndex + 1}/5</span> — next in 15s`;
  launchIndex++;
  timerStart = Date.now();
  cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(tickTimer);
}

launchBtn.addEventListener('click', () => {
  if (launchTimer) return;
  launchIndex = 0;
  launchBtn.disabled = true;
  timerWrap.classList.add('visible');
  timerBar.style.width = '100%';
  openNextLink();
  launchTimer = setInterval(openNextLink, INTERVAL);
});
</script>
</body>
</html>
