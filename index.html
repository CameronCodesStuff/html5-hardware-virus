<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-File Downloader & Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.5;
            color: #5f6368;
        }
        .status-box {
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 6px;
            font-size: 14px;
            border-left: 4px solid #ccc;
            background-color: #f1f3f4;
            transition: all 0.3s ease;
        }
        .status-warning {
            background-color: #fcf8e3;
            border-left-color: #f0ad4e;
            color: #8a6d3b;
        }
        .status-danger {
            background-color: #f2dede;
            border-left-color: #d9534f;
            color: #a94442;
        }
        .status-success {
            background-color: #dff0d8;
            border-left-color: #5cb85c;
            color: #3c763d;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Multiple File Downloader</h1>
    <p>Click below to check your browser permissions and download your sample files.</p>
    
    <div class="status-box status-warning" id="statusBox">
        <strong>Status: Ready to test</strong><br>
        Click the button below. If downloads fail, we will detect it and show you instructions.
    </div>

    <button class="btn" id="downloadBtn">Check & Download Files</button>
    
    <p class="footer-note">Note: Generates mock text files locally inside your browser.</p>
</div>

<script>
    const downloadBtn = document.getElementById('downloadBtn');
    const statusBox = document.getElementById('statusBox');

    function checkPopupsBlocked() {
        try {
            const testPopup = window.open('about:blank', '_blank', 'width=1,height=1,top=9999,left=9999');
            
            if (!testPopup || testPopup.closed || typeof testPopup.closed === 'undefined') {
                return true;
            }
            
            testPopup.close();
            return false; 
        } catch (e) {
            return true; 
        }
    }

    function triggerDownloads() {
        const files = [
            { name: 'Document_1.txt', content: 'First file content.' },
            { name: 'Document_2.txt', content: 'Second file content.' },
            { name: 'Document_3.txt', content: 'Third file content.' }
        ];

        files.forEach((file, index) => {
            setTimeout(() => {
                const blob = new Blob([file.content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, index * 200);
        });
    }

    downloadBtn.addEventListener('click', () => {
        const isBlocked = checkPopupsBlocked();

        if (isBlocked) {
            statusBox.className = "status-box status-danger";
            statusBox.innerHTML = `
                <strong>❌ Popups/Downloads Blocked!</strong><br>
                Your browser stopped the action. Please click the icon in your <strong>address bar</strong> (top right) and select <strong>"Always allow popups and downloads from this site"</strong>, then try again.
            `;
        } else {
            statusBox.className = "status-box status-success";
            statusBox.innerHTML = `
                <strong>✅ Permissions Allowed!</strong><br>
                Popups are unblocked. Triggering your multiple file downloads now...
            `;
            triggerDownloads();
        }
    });
</script>

</body>
</html>
