<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4757;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Popup Trigger Active</h1>
        <p>A browser alert will pop up every 5 seconds.</p>
        <p><em>To make it stop, simply close this browser tab!</em></p>
    </div>

    <script>
        setInterval(function() {
            alert("Time's up! 5 seconds have passed.");
        }, 5);
    </script>

</body>
</html>
